<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 160" width="160" height="160">
  <defs>
    <!-- Recreates your CSS linear-gradient -->
    <linearGradient id="sunbeamGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" stop-opacity="1" />
      <stop offset="100%" stop-color="#fbbf24" stop-opacity="0.04" />
    </linearGradient>
    
    <!-- Recreates your CSS drop-shadow filter -->
    <filter id="sunbeamShadow" x="-50%" y="-50%" width="200%" height="200%">
      <feDropShadow dx="0" dy="0" stdDeviation="20" flood-color="#fbbf24" flood-opacity="0.5" />
    </filter>
  </defs>

  <!-- Group to handle your 334° rotation from center (80, 80) -->
  <g transform="rotate(334 80 80)" filter="url(#sunbeamShadow)">
    <path d="M 80 10 C 80 10, 98 10, 98 28 C 98 37, 113.5 123, 113.5 132 C 113.5 150, 46.5 150, 46.5 132 C 46.5 123, 62 37, 62 28 C 62 10, 80 10, 80 10 Z" fill="url(#sunbeamGrad)" />
  </g>
</svg>