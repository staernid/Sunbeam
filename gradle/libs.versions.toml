[versions]
agp = "8.13.0"
kotlin = "2.1.10"
coroutines = "1.10.1"
bouncycastle = "1.85"
jcodec = "0.2.5"
okhttp = "4.12.0"
jmdns = "3.6.3"
shieldControllerExtensions = "1.0.1"
gson = "2.13.1"
androidxAnnotation = "1.9.1"
androidxCardview = "1.0.0"
androidxAppcompat = "1.7.1"
androidxDatastore = "1.1.2"
androidxPreference = "1.2.1"
androidxRecyclerview = "1.4.0"
material = "1.13.0"
searchPreference = "v2.5.1"
mpAndroidChart = "v3.1.0"
litert = "1.4.0"
opencv = "4.12.0"
desugarJdkLibs = "2.1.5"
composeBom = "2025.02.00"
androidxActivity = "1.10.0"
androidxLifecycle = "2.8.7"

junit = "4.13.2"
androidxTestCore = "1.7.0"
robolectric = "4.16"
mockito = "5.19.0"

detekt = "1.23.8"
ktlint = "12.1.2"

[libraries]
bouncycastle-bcprov = { module = "org.bouncycastle:bcprov-jdk18on", version.ref = "bouncycastle" }
bouncycastle-bcpkix = { module = "org.bouncycastle:bcpkix-jdk18on", version.ref = "bouncycastle" }
jcodec = { module = "org.jcodec:jcodec", version.ref = "jcodec" }
okhttp = { module = "com.squareup.okhttp3:okhttp", version.ref = "okhttp" }
jmdns = { module = "org.jmdns:jmdns", version.ref = "jmdns" }
shield-controller-extensions = { module = "com.github.cgutman:ShieldControllerExtensions", version.ref = "shieldControllerExtensions" }
gson = { module = "com.google.code.gson:gson", version.ref = "gson" }
androidx-annotation = { module = "androidx.annotation:annotation", version.ref = "androidxAnnotation" }
androidx-cardview = { module = "androidx.cardview:cardview", version.ref = "androidxCardview" }
androidx-appcompat = { module = "androidx.appcompat:appcompat", version.ref = "androidxAppcompat" }
androidx-datastore = { module = "androidx.datastore:datastore-preferences", version.ref = "androidxDatastore" }
androidx-datastore-core = { module = "androidx.datastore:datastore-core", version.ref = "androidxDatastore" }
androidx-preference = { module = "androidx.preference:preference", version.ref = "androidxPreference" }
androidx-recyclerview = { module = "androidx.recyclerview:recyclerview", version.ref = "androidxRecyclerview" }
material = { module = "com.google.android.material:material", version.ref = "material" }
search-preference = { module = "com.github.ByteHamster:SearchPreference", version.ref = "searchPreference" }
mp-android-chart = { module = "com.github.PhilJay:MPAndroidChart", version.ref = "mpAndroidChart" }
litert = { module = "com.google.ai.edge.litert:litert", version.ref = "litert" }
litert-gpu = { module = "com.google.ai.edge.litert:litert-gpu", version.ref = "litert" }
opencv = { module = "org.opencv:opencv", version.ref = "opencv" }
desugar-jdk-libs = { module = "com.android.tools:desugar_jdk_libs", version.ref = "desugarJdkLibs" }

androidx-compose-bom = { module = "androidx.compose:compose-bom", version.ref = "composeBom" }
androidx-compose-ui = { module = "androidx.compose.ui:ui" }
androidx-compose-ui-graphics = { module = "androidx.compose.ui:ui-graphics" }
androidx-compose-ui-tooling = { module = "androidx.compose.ui:ui-tooling" }
androidx-compose-ui-tooling-preview = { module = "androidx.compose.ui:ui-tooling-preview" }
androidx-compose-foundation = { module = "androidx.compose.foundation:foundation" }
androidx-compose-material3 = { module = "androidx.compose.material3:material3" }
androidx-compose-material3-windowsizeclass = { module = "androidx.compose.material3:material3-window-size-class" }
androidx-compose-material-icons-core = { module = "androidx.compose.material:material-icons-core" }
androidx-compose-material-icons-extended = { module = "androidx.compose.material:material-icons-extended" }
androidx-activity-compose = { module = "androidx.activity:activity-compose", version.ref = "androidxActivity" }
androidx-lifecycle-runtime-compose = { module = "androidx.lifecycle:lifecycle-runtime-compose", version.ref = "androidxLifecycle" }

test-compose-ui-junit4 = { module = "androidx.compose.ui:ui-test-junit4" }
test-compose-ui-manifest = { module = "androidx.compose.ui:ui-test-manifest" }

kotlinx-coroutines-core = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-core", version.ref = "coroutines" }
kotlinx-coroutines-android = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-android", version.ref = "coroutines" }
kotlinx-coroutines-test = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-test", version.ref = "coroutines" }

# Build plugins dependencies
android-gradlePlugin = { module = "com.android.tools.build:gradle", version.ref = "agp" }
kotlin-gradlePlugin = { module = "org.jetbrains.kotlin:kotlin-gradle-plugin", version.ref = "kotlin" }
compose-compiler-gradlePlugin = { module = "org.jetbrains.kotlin:compose-compiler-gradle-plugin", version.ref = "kotlin" }
detekt-gradlePlugin = { module = "io.gitlab.arturbosch.detekt:detekt-gradle-plugin", version.ref = "detekt" }
ktlint-gradlePlugin = { module = "org.jlleitschuh.gradle:ktlint-gradle", version.ref = "ktlint" }

test-junit = { module = "junit:junit", version.ref = "junit" }
test-androidx-core = { module = "androidx.test:core", version.ref = "androidxTestCore" }
test-robolectric = { module = "org.robolectric:robolectric", version.ref = "robolectric" }
test-mockito = { module = "org.mockito:mockito-core", version.ref = "mockito" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
android-library = { id = "com.android.library", version.ref = "agp" }
kotlin-android = { id = "org.jetbrains.kotlin.android", version.ref = "kotlin" }
kotlin-compose = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
detekt = { id = "io.gitlab.arturbosch.detekt", version.ref = "detekt" }
ktlint = { id = "org.jlleitschuh.gradle.ktlint", version.ref = "ktlint" }
