name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    name: Build & Publish Release APKs
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install NDK
        run: |
          yes | sdkmanager --install "ndk;27.0.12077973"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Assemble Release and Debug APKs
        run: ./gradlew :app:assembleRelease :app:assembleDebug

      - name: Sign Release APKs & Generate Checksums
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -euo pipefail

          if [ -z "$KEYSTORE_BASE64" ] || [ -z "$KEYSTORE_PASSWORD" ] || [ -z "$KEY_ALIAS" ] || [ -z "$KEY_PASSWORD" ]; then
            echo "All Android signing secrets must be configured before publishing a release." >&2
            exit 1
          fi

          mkdir -p release-artifacts
          BUILD_TOOLS_DIR=$(ls -d "$ANDROID_HOME/build-tools/"* | sort -V | tail -n 1)
          shopt -s nullglob
          apks=(app/build/outputs/apk/release/*.apk)
          if [ "${#apks[@]}" -eq 0 ]; then
            echo "No release APKs were produced." >&2
            exit 1
          fi

          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > release.keystore
          trap 'rm -f release.keystore' EXIT
          for apk in "${apks[@]}"; do
            base_name=$(basename "$apk" -unsigned.apk)
            base_name=$(basename "$base_name" .apk)
            aligned_apk="release-artifacts/${base_name}-aligned.apk"
            signed_apk="release-artifacts/${base_name}-signed.apk"
            "$BUILD_TOOLS_DIR/zipalign" -v -p 4 "$apk" "$aligned_apk"
            "$BUILD_TOOLS_DIR/apksigner" sign \
              --ks release.keystore \
              --ks-pass env:KEYSTORE_PASSWORD \
              --ks-key-alias "$KEY_ALIAS" \
              --key-pass env:KEY_PASSWORD \
              --out "$signed_apk" \
              "$aligned_apk"
            "$BUILD_TOOLS_DIR/apksigner" verify --verbose "$signed_apk"
            rm -f "$aligned_apk"
          done

          cd release-artifacts
          sha256sum *.apk > SHA256SUMS.txt

      - name: Capture curated app screenshots
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          script: |
            apk_path=$(find app/build/outputs/apk/debug -name '*x86_64*debug.apk' -print -quit)
            test -n "$apk_path"
            adb install "$apk_path"
            adb shell wm size 1080x2400
            adb shell wm density 420
            mkdir -p release-artifacts/screenshots

            for screen in hosts apps profiles settings; do
              adb shell am force-stop io.github.staernid.sunbeam.debug
              adb shell am start -W \
                -n io.github.staernid.sunbeam.debug/io.github.staernid.sunbeam.ReleaseScreenshotActivity \
                --es screen "$screen"
              sleep 2
              adb exec-out screencap -p > "release-artifacts/screenshots/$screen.png"
              test -s "release-artifacts/screenshots/$screen.png"
            done

      - name: Upload screenshots for review
        uses: actions/upload-artifact@v4
        with:
          name: release-screenshots-${{ github.ref_name }}
          path: release-artifacts/screenshots/*.png
          if-no-files-found: error
          retention-days: 30

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            release-artifacts/*.apk
            release-artifacts/SHA256SUMS.txt
