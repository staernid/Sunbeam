name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    name: Build & Publish Release APKs
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install NDK
        run: |
          yes | sdkmanager --install "ndk;27.0.12077973"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Assemble Release APKs
        run: ./gradlew :app:assembleRelease

      - name: Sign or Prepare Release APKs & Checksums
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          mkdir -p release-artifacts
          BUILD_TOOLS_DIR=$(ls -d "$ANDROID_HOME/build-tools/"* | sort -V | tail -n 1)

          if [ -n "$KEYSTORE_BASE64" ] && [ -n "$KEYSTORE_PASSWORD" ] && [ -n "$KEY_ALIAS" ] && [ -n "$KEY_PASSWORD" ]; then
            echo "$KEYSTORE_BASE64" | base64 --decode > release.keystore
            for apk in app/build/outputs/apk/release/*.apk; do
              base_name=$(basename "$apk" -unsigned.apk)
              base_name=$(basename "$base_name" .apk)
              aligned_apk="release-artifacts/${base_name}-aligned.apk"
              signed_apk="release-artifacts/${base_name}-signed.apk"
              "$BUILD_TOOLS_DIR/zipalign" -v -p 4 "$apk" "$aligned_apk"
              "$BUILD_TOOLS_DIR/apksigner" sign \
                --ks release.keystore \
                --ks-pass env:KEYSTORE_PASSWORD \
                --ks-key-alias "$KEY_ALIAS" \
                --key-pass env:KEY_PASSWORD \
                --out "$signed_apk" \
                "$aligned_apk"
              rm -f "$aligned_apk"
            done
            rm -f release.keystore
          else
            for apk in app/build/outputs/apk/release/*.apk; do
              cp "$apk" release-artifacts/
            done
          fi

          cd release-artifacts
          sha256sum *.apk > SHA256SUMS.txt

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            release-artifacts/*.apk
            release-artifacts/SHA256SUMS.txt
