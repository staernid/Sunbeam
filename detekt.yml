build:
  maxIssues: 0
  excludeCorrectable: false

naming:
  PackageNaming:
    active: true
  FunctionNaming:
    ignoreAnnotated: ['Composable']

complexity:
  LongParameterList:
    ignoreAnnotated: ['Composable']

exceptions:
  PrintStackTrace:
    active: true

style:
  ForbiddenComment:
    active: false
  MagicNumber:
    ignorePropertyDeclaration: true
